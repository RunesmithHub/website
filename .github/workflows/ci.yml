name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUB_INDEX_DIR: tests/fixtures/.generated/default/index
      HUB_TRUST_ROOT: tests/fixtures/.generated/default/index/root/1.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check the lock file sources
        run: |
          if grep -nE "tarball:|type: git|repo:" pnpm-lock.yaml; then
            echo "The lock file resolves a package from outside the npm registry."
            exit 1
          fi
      - name: Audit
        run: pnpm audit
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: node --test "tests/unit/*.test.ts"
      - name: Build without an index
        run: env -u HUB_INDEX_DIR -u HUB_TRUST_ROOT pnpm build
      - name: Generate the fixture index
        run: pnpm fixture
      - name: Build against the fixture
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  osv:
    name: OSV-Scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the project lock file document
        run: |
          mkdir -p .osv
          awk 'BEGIN { n = 0 } /^---$/ { n++; next } n == 2' pnpm-lock.yaml > .osv/pnpm-lock.yaml
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=.osv/pnpm-lock.yaml
